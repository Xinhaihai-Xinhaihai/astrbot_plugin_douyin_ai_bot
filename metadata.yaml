name: astrbot_plugin_douyin_ai_bot
display_name: 抖音AI陪看
desc: |
  抖音直播订阅检测 + AI 陪看评论 + 主动刷视频。
  - 直播订阅：定时轮询开播状态，开播推「封面+链接+配文」到指定群，群里说触发词即时查
  - 陪看评论：发视频链接 → 下载抽帧喂多模态视觉模型 → 生成像真人的短评 → 登录身份发出 → 渲染截图推群
  - 主动刷视频：定时刷候选（特别关心 up 优先）→ 视觉模型打分 → 过线才评 → 截图推转发群
  - 互动提醒：轮询私信/评论回复，推转发群，支持一键回私信
  不点赞、不刷量，评论频率受同视频冷却+全局间隔双重限制。
